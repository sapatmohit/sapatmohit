name: Refresh station vitals

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vitals
  cancel-in-progress: true

jobs:
  vitals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # status.py needs the full history

      - name: Regenerate assets/status.svg
        run: python3 scripts/status.py

      - name: Commit if it changed
        run: |
          git config user.name  "sys78"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/status.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "vitals: unattended refresh"
          git push
