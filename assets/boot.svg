<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="SYS/78 terminal boot sequence" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.30"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>

    <filter id="bloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="typeclip">
      <rect x="52" y="264" width="0" height="26">
        <animate attributeName="width" from="0" to="330" begin="6.4s" dur="1.9s"
                 fill="freeze" calcMode="discrete"
                 values="0;40;72;110;145;178;210;248;286;330"/>
      </rect>
    </clipPath>

    <style>
      .t { font-family: "SFMono-Regular", "DejaVu Sans Mono", Consolas, "Courier New", monospace;
           font-size: 15px; letter-spacing: 1.2px; fill: #FFB94A; }
      .dim  { fill: #8A5F22; }
      .ok   { fill: #6FE87A; }
      .fail { fill: #FF4D6D; }
      .head { font-size: 17px; letter-spacing: 3.4px; fill: #FFD79A; }

      .r { opacity: 0; animation: on 0.12s steps(2) forwards; }
      @keyframes on { from { opacity: 0 } to { opacity: 1 } }

      .d1 { animation-delay: .35s }  .d2 { animation-delay: 1.15s }
      .d3 { animation-delay: 1.75s } .d4 { animation-delay: 2.35s }
      .d5 { animation-delay: 3.10s } .d6 { animation-delay: 3.95s }
      .d7 { animation-delay: 5.10s } .d8 { animation-delay: 5.75s }

      .cur { fill: #FFB94A; opacity: 0; animation: blink 1.06s steps(1) 8.4s infinite; }
      @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }

      .flick { animation: flick 5.5s ease-in-out .2s infinite; }
      @keyframes flick {
        0%,96%,100% { opacity: 1 } 97% { opacity: .82 } 98.5% { opacity: 1 }
      }
    </style>
  </defs>

  <rect width="800" height="360" rx="14" fill="#120C08"/>
  <rect x="7" y="7" width="786" height="346" rx="10" fill="#0A0705" stroke="#3A2612" stroke-width="1.5"/>

  <g class="flick">
    <g filter="url(#bloom)">
      <text class="t head r d1" x="52" y="62">S Y S / 7 8</text>
      <text class="t dim r d1" x="52" y="86">monochrome operator terminal &#183; amber phosphor &#183; rev 4</text>

      <g class="t">
        <g class="r d2">
          <text x="52" y="134">RAM 65536K</text>
          <text class="dim" x="235" y="134">.....................</text>
          <text class="ok" x="470" y="134">OK</text>
        </g>
        <g class="r d3">
          <text x="52" y="158">PHOSPHOR ARRAY</text>
          <text class="dim" x="235" y="158">.....................</text>
          <text class="ok" x="470" y="158">OK</text>
        </g>
        <g class="r d4">
          <text x="52" y="182">DOOR SEALS</text>
          <text class="dim" x="235" y="182">.....................</text>
          <text class="ok" x="470" y="182">OK</text>
        </g>
        <g class="r d5">
          <text x="52" y="206">LIFE SUPPORT</text>
          <text class="dim" x="235" y="206">.....................</text>
          <text class="fail" x="470" y="206">FAIL</text>
        </g>
        <g class="r d6">
          <text x="52" y="230">OPERATOR PRESENT</text>
          <text class="dim" x="235" y="230">.....................</text>
          <text class="fail" x="470" y="230">NO</text>
        </g>
      </g>

      <text class="t dim r d7" x="52" y="262">whoever sat here left in a hurry.</text>

      <g clip-path="url(#typeclip)">
        <text class="t" x="52" y="284">their session is still open.</text>
      </g>

      <rect class="cur" x="392" y="270" width="10" height="17"/>
    </g>
  </g>

  <rect x="7" y="7" width="786" height="346" rx="10" fill="url(#scan)"/>
  <rect x="7" y="7" width="786" height="346" rx="10" fill="url(#vig)"/>
</svg>
